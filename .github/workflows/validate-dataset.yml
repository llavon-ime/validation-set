name: Validate dataset

on:
  push:
    paths:
      - validation.jsonl
      - scripts/**
      - tests/**
      - package.json
      - .gitattributes
      - .github/workflows/**
  pull_request:
    paths:
      - validation.jsonl
      - scripts/**
      - tests/**
      - package.json
      - .gitattributes
      - .github/workflows/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm run validate
